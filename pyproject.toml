[project]
name = "tweet-feed-digest"
version = "0.1.0"
description = "Static, GitHub-rendered archive of daily AI/tech X-timeline digests."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
